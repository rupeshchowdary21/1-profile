<!DOCTYPE html>
<html>
<head>
    <title>Git Collaboration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: lightblue;
            text-align: center;
            padding: 50px;
        }

        .container {
            background-color: white;
            width: 550px;
            margin: auto;
            padding: 35px;
            border-radius: 15px;
        }

        h1 {
            color: darkblue;
        }

        .member {
            background-color: lightgray;
            padding: 15px;
            margin: 15px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            background-color: darkblue;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: blue;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1><h1>Git Collaboration Project - Team Work</h1></h1>

        <p>
            This project demonstrates collaboration
            using Git and GitHub.
        </p>

        <div class="member">
            <h2>Team Member 1</h2>
            <p>Worked on the header section.</p>
        </div>

        <div class="member">
            <h2>Team Member 2</h2>
            <p>Worked on the content section.</p>
        </div>

        <div class="member">
            <h2>Team Member 3</h2>
            <p>Worked on the footer section.</p>
        </div>

        <button onclick="showMessage()">
            Collaboration Complete
        </button>

        <p id="message"></p>

    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "Git collaboration completed successfully!";
        }
    </script>

</body>
</html>
